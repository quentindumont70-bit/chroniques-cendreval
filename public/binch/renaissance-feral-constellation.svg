<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">La Voie farouche — constellation du grimoire</title>
<desc id="desc">Illustration fantastique originale, sans prétention d'être un arbre de talents officiel : croissant de lune, silhouettes de griffes et sept étoiles reliées dans une forêt nocturne.</desc>
