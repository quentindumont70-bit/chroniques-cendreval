<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title description">
<title id="title">Esprit du félin — gardien de la forêt</title>
<desc id="description">Illustration originale d'un grand félin spectral vert émeraude, tapi dans les fougères sous la lune, pour le décor du Druide de La Binch.</desc>
<defs>
 <radialGradient id="aura"><stop stop-color="#b9f6b9" stop-opacity=".29"/><stop offset=".37" stop-color="#85ddbb" stop-opacity=".17"/><stop offset="1" stop-color="#4ebeac" stop-opacity="0"/></radialGradient>
 <radialGradient id="fur" cx=".45" cy=".2"><stop stop-color="#365d52"/><stop offset=".56" stop-color="#173e3d"/><stop offset="1" stop-color="#071d27"/></radialGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#ecffc6"/><stop offset=".5" stop-color="#86d9bc"/><stop offset="1" stop-color="#4b928c"/></linearGradient>
 <linearGradient id="mane" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#7fd4b3"/><stop offset="1" stop-color="#183d42"/></linearGradient>
 <filter id="bloom"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="eyeGlow"><feGaussianBlur stdDeviation="4"/></filter>
 <g id="leaf"><path d="M0 0Q-16-36-6-74Q26-40 0 0" fill="#1a5b49" stroke="#9de1b7" stroke-width="1.5"/></g>
</defs>
<ellipse cx="474" cy="350" rx="359" ry="299" fill="url(#aura)"/>
