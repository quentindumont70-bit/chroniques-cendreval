name: La Binch — Golipette QA

on:
  pull_request:
    paths:
      - 'public/binch/**'
      - 'scripts/check-binch.mjs'
      - 'scripts/test-binch-golipette.mjs'
      - '.github/workflows/binch-golipette-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binch-golipette-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binch-qa:
    name: Specs, AH, bridge and static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Binch regression suite
        run: node scripts/test-binch-golipette.mjs

  binch-browser:
    name: Browser smoke — desktop and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright
        run: |
          npm install --prefix /tmp/binch-browser --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          /tmp/binch-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Smoke test Specs in Chromium
        env:
          BINCH_PLAYWRIGHT_PATH: /tmp/binch-browser/node_modules/playwright/index.mjs
        run: node scripts/test-binch-browser.mjs

  binch-windows:
    name: Windows PowerShell installer syntax
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows installer and local companion without executing them
        shell: powershell
        run: |
          $files = @(
            'public/binch/Installer-La-Binch.ps1',
            'public/binch/Compagnon-La-Binch.ps1'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing: $file" }
            $tokens = $null
            $errors = $null
            $full = (Resolve-Path -LiteralPath $file).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              foreach ($error in $errors) { Write-Error "$file : $($error.Message)" }
              throw "PowerShell syntax failed: $file"
            }
            Write-Host "PowerShell 5.1 syntax OK: $file"
          }

  binch-addon:
    name: GrimoireSync Lua 5.1 preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Check addon manifest and Lua syntax without launching WoW
        shell: bash
        run: |
          set -euo pipefail
          addon=public/binch/addon/GrimoireSync
          test -f "$addon/GrimoireSync.toc"
          count=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            [[ -z "$line" || "$line" == '##'* ]] && continue
            [[ "$line" =~ ^[A-Za-z0-9_-]+[.]lua$ ]] || { echo "Unexpected TOC entry: $line"; exit 1; }
            test -f "$addon/$line" || { echo "Missing Lua file: $line"; exit 1; }
            luac5.1 -p "$addon/$line"
            echo "Lua 5.1 syntax OK: $line"
            count=$((count+1))
          done < "$addon/GrimoireSync.toc"
          test "$count" -eq 3 || { echo "Expected three Lua files, got $count"; exit 1; }
          echo "GrimoireSync: manifest and three Lua files passed preflight"
      - name: Validate real Lua export against browser parser
        shell: bash
        run: |
          set -euo pipefail
          lua5.1 scripts/test-grimoiresync-mock.lua | node public/binch/test-grimoiresync-interop.cjs
