name: La Binch — Golipette QA

on:
  pull_request:
    paths:
      - 'public/binch/**'
      - 'scripts/check-binch.mjs'
      - 'scripts/test-binch-golipette.mjs'
      - '.github/workflows/binch-golipette-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binch-golipette-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binch-qa:
    name: Specs, AH, bridge and static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Binch regression suite
        run: node scripts/test-binch-golipette.mjs
