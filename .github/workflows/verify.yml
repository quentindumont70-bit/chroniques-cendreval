name: Vérification des modifications

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests et compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types
        run: npm run typecheck:game
      - name: Exécuter les tests et compiler GitHub Pages
        run: npm test
      - name: Tests AH et navigation mobile de La Binch
        run: node --test tests/binch-ah-trading.test.mjs tests/binch-ah-portfolio.test.mjs tests/binch-ah-feed.test.mjs tests/binch-ah-mobile.test.mjs tests/binch-ahledger.test.mjs
      - name: Vérifier la Renaissance visuelle de La Binch
        run: |
          node --test tests/binch-visual-renaissance.test.mjs
          python3 -c "import xml.etree.ElementTree as ET, pathlib; paths=list(pathlib.Path('public/binch').glob('renaissance-*.svg')); assert len(paths)==35, f'Expected 35 original Renaissance SVG assets, got {len(paths)}'; [ET.parse(path) for path in paths]; print('Validated',len(paths),'original SVG artworks')"
      - name: Capturer la galerie Renaissance pour revue graphique
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/binch-visual-renaissance-20261118'
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "Navigateur Chromium absent : captures facultatives ignorées"; exit 0; fi
          mkdir -p renaissance-captures
          for class in druid mage warlock; do
            "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,960 --screenshot="renaissance-captures/${class}-desktop.png" "file://$PWD/public/binch/renaissance-atelier.html?classe=${class}"
          done
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=430,860 --screenshot="renaissance-captures/druid-mobile.png" "file://$PWD/public/binch/renaissance-atelier.html?classe=druid"
          # Captures de la vraie interface initiale : le profil ne sera ni créé ni modifié.
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=3500 --window-size=1440,960 --screenshot="renaissance-captures/onboarding-desktop.png" "file://$PWD/public/binch/index.html"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=3500 --window-size=430,860 --screenshot="renaissance-captures/onboarding-mobile.png" "file://$PWD/public/binch/index.html"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,960 --screenshot="renaissance-captures/creation-classe-desktop.png" "file://$PWD/public/binch/renaissance-onboarding-atelier.html"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=430,860 --screenshot="renaissance-captures/creation-classe-mobile.png" "file://$PWD/public/binch/renaissance-onboarding-atelier.html"
          # P10 interactive art direction: two distinct identities, no profile storage.
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=2800 --window-size=1440,960 --screenshot="renaissance-captures/p10-tauren-druid-desktop.png" "file://$PWD/public/binch/renaissance-p10-showcase.html?race=Tauren&classe=Druide&jobs=Herboristerie,Alchimie"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=2800 --window-size=430,860 --screenshot="renaissance-captures/p10-tauren-druid-mobile.png" "file://$PWD/public/binch/renaissance-p10-showcase.html?race=Tauren&classe=Druide&jobs=Herboristerie,Alchimie"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=2800 --window-size=1440,960 --screenshot="renaissance-captures/p10-forsaken-warlock-desktop.png" "file://$PWD/public/binch/renaissance-p10-showcase.html?race=MortVivant&classe=D%C3%A9moniste&jobs=Ing%C3%A9nierie,Enchantement"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=2800 --window-size=430,860 --screenshot="renaissance-captures/p10-forsaken-warlock-mobile.png" "file://$PWD/public/binch/renaissance-p10-showcase.html?race=MortVivant&classe=D%C3%A9moniste&jobs=Ing%C3%A9nierie,Enchantement"
          ls -lh renaissance-captures/
      - name: Conserver les captures de revue (3 jours, sans publication Pages)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/binch-visual-renaissance-20261118'
        uses: actions/upload-artifact@v4
        with:
          name: binch-renaissance-captures
          path: renaissance-captures/*.png
          retention-days: 3
          if-no-files-found: warn
      - name: Tester le HUD mobile Renaissance
        run: node --test tests/binch-visual-renaissance-dock.test.mjs
      - name: Tester la constellation et les chapitres Renaissance
        run: node --test tests/binch-visual-renaissance-finale.test.mjs
      - name: Tester la création de personnage Renaissance et ses choix accessibles
        run: node --test tests/binch-visual-renaissance-onboarding.test.mjs
      - name: Tester l'identité visuelle composite et la reforge sans perte de données
        run: node --test tests/binch-visual-identity-compositor.test.mjs
      - name: Vérifier la présence de Big Cthu dans le paquet Pages
        run: |
          node scripts/stage-big-cthu-beta.mjs
          test -f pages-dist/big-cthu-beta/index.html
          test -f pages-dist/big-cthu-beta/flashcards.html
