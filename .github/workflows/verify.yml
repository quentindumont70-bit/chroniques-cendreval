name: Vérification des modifications

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests et compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types
        run: npm run typecheck:game
      - name: Exécuter les tests et compiler GitHub Pages
        run: npm test
      - name: Tests AH et navigation mobile de La Binch
        run: node --test tests/binch-ah-trading.test.mjs tests/binch-ah-portfolio.test.mjs tests/binch-ah-feed.test.mjs tests/binch-ah-mobile.test.mjs tests/binch-ahledger.test.mjs
      - name: Vérifier la Renaissance visuelle de La Binch
        run: |
          node --test tests/binch-visual-renaissance.test.mjs
          python3 -c "import xml.etree.ElementTree as ET, pathlib; paths=list(pathlib.Path('public/binch').glob('renaissance-*.svg')); assert len(paths)==10, f'Expected ten original scenes, got {len(paths)}'; [ET.parse(path) for path in paths]; print('Validated',len(paths),'SVG scenes')"
      - name: Vérifier la présence de Big Cthu dans le paquet Pages
        run: |
          node scripts/stage-big-cthu-beta.mjs
          test -f pages-dist/big-cthu-beta/index.html
          test -f pages-dist/big-cthu-beta/flashcards.html
