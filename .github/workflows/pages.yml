name: Publier Chroniques de Cendreval

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pages must not be blocked by unrelated game / trading tests.
      # Build the existing site and validate the public Big Cthu shell.
      - run: npm run build:pages
      - name: Contrôles ciblés Big Cthu iPhone
        run: node --test tests/big-cthu-iphone.test.mjs
      - name: Tests de la planification Ultimate
        run: node --test tests/binch-ultimate-journey.test.mjs
      - name: Contrôles du portail La Binch
        continue-on-error: true
        run: node scripts/check-binch.mjs
      - name: Capturer les arbres Forever en lecture seule
        continue-on-error: true
        run: node scripts/snapshot-forever-talents.mjs
      - name: Inclure les fichiers publics Big Cthu dans le site Pages
        run: node scripts/stage-big-cthu-beta.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
