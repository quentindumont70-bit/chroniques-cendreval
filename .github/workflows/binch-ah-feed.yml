name: La Binch — flux AH communautaire

# Relevés publics auctionhouse.fyi des marchés WoW Forever, publiés sur la branche
# binch-ah-data (un seul commit, réécrit à chaque passage). Lu par l'Assistant Trading
# via raw.githubusercontent.com. Les déclenchements programmés ne s'activent qu'une fois
# ce fichier présent sur la branche par défaut.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binch-ah-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collecter les cotations
        run: node scripts/collect-ah-feed.mjs /tmp/ah-feed.json
      - name: Publier sur binch-ah-data
        run: |
          set -e
          mkdir /tmp/data && cd /tmp/data
          git init -q -b binch-ah-data
          cp /tmp/ah-feed.json ah-feed.json
          git config user.name "La Binch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ah-feed.json
          git commit -q -m "Flux AH $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" binch-ah-data
